<div class="adminmovie">
  <h2>ajout d'une actualité</h2>
  movie name:
  <div class="recherchemovie">
    <input
      type="text"
      id="tempo"
      #inputSearch
      class="form-control"
      (keyup)="search(inputSearch)"
    >
    {{movieName}}
    <div *ngIf="movies">
      <li *ngFor="let movie of searchMovies" class="list-movie">
        {{movie.idMovie}}
        {{movie.nameMovie}}
        <button (click)="select(movie)">Select</button>
      </li>
    </div>

  </div>

  <form [formGroup]="form" (ngSubmit)="emitActuCreated()">
    <div>
      <label>
        News: <input type="text" formControlName="newsActu" required class="grand">
      </label>
      <div *ngIf="control('newsActu')?.dirty && control('newsActu')?.invalid">
        Please, you have to provide a news for the movie.
      </div>
    </div>


    <input type="submit" [disabled]="form.invalid" (click)="endInput()">
  </form>
</div>

<div>
  <ul *ngIf="actus">
    <li *ngFor="let actu of actus">
      <span *ngFor="let movie of movies">
        <span *ngIf=" actu.idMovieRef == movie.idMovie">
          {{movie.nameMovie}}
        </span>
      </span>
      - {{actu.release_actu}} - {{actu.newsActu.slice(0,15) }}...
      <button (click)="emitActuDeleted(actu)">supprimer</button>
    </li>
  </ul>
</div>
