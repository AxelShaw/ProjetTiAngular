<p>nombre d'utilisateur inscrit : {{users.length}}</p>

<div *ngIf="connectAdmin()" class="rechercheUser">
  <h2>Rechercher un utilisateur</h2>
  <input
    type="text"
    id="tempo"
    #inputSearch
    class="form-control"
    (keyup)="search(inputSearch)"
  >


  <div *ngIf="users">
    <li *ngFor="let user of searchUsers" class="list-movie">
      {{user.idUser}}
      {{user.nickname}}
      <button (click)="emitUserDeleted(user)">ban</button>
    </li>
  </div>


</div>
