
<div class="rechercheUser">
  <h2>rechercher un utilisateur</h2>
  <input
    type="text"
    id="tempo"
    #inputSearch
    class="form-control"
    (keyup)="search(inputSearch)"
  >




  <div *ngIf="users">
    <li *ngFor="let user of searchUsers" class="list-movie">
      {{user.idUser}}
      {{user.nickname}}
<!--      <button (click)="emitMovieDeleted(movie)">ban</button>-->
    </li>
  </div>


</div>
