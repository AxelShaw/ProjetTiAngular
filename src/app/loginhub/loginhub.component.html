<div class="all">
  <div class="registeruserAll">
    <h2>Connexion</h2>
    <form [formGroup]="form" (ngSubmit)="emitUserLogin()">
      <div>
        <p>
          Mail :
        </p>
        <input type="text"  formControlName="mail" placeholder="exemple@mail.com"
               size="30" required >
        <span *ngIf="control('mail')?.dirty && control('mail')?.invalid">
          mail requis*
        </span>
      </div>
      <div>
        <p>
          mot de passe :
        </p>
        <input type="password" formControlName="password" required >
        <span *ngIf="control('password')?.dirty && control('password')?.invalid">
          mot de passe requis*
        </span>

      </div>
      <div class="submitbtn">
        <input type="submit" [disabled]="form.invalid" >
      </div>
    </form>
    <p>
      Vous n'avez pas de compte ?
      <a routerLink="../registerhub" class="aInscription">S'inscrire</a>
    </p>
  </div>
</div>
