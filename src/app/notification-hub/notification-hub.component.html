<div *ngIf="favories">
  <ul *ngIf="actus">
    <li *ngFor="let actu of actus">
      <span *ngFor="let favorie of favories">
        <span *ngIf="actu.idMovieRef == favorie.idMovieRef && DeleteNot.includes(actu.idActu) == false">
          <p>
            <span *ngIf="seeNot.includes(actu.idActu) == false">New*</span>
            <span *ngFor="let movie of movies">
              <span *ngIf=" actu.idMovieRef == movie.idMovie">
                {{movie.nameMovie}}
              </span>
            </span> - {{actu.release_actu}}
            <button (click)="saveDelete(actu.idActu)">X</button>
            <span *ngIf="seeNot.includes(actu.idActu) == false">
              <button (click)="saveSee(actu.idActu)">V</button>
            </span >
        </p>
          {{actu.newsActu}}
        </span>
      </span>
    </li>
  </ul>
</div>
