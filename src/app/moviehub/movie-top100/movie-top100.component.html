<h2>Home</h2>
<div *ngIf="ratings.length; else movieListEmpty">
  <ul>
    <div *ngFor="let rating of ratings" class="home">
      <span *ngFor="let movie of movies">
        <li *ngIf="movie.idMovie == rating.movieRefId && rating.numVote != 0" class="ratingSpan">
          <a routerLink="../detail/{{movie.idMovie}}">
            <img src="{{movie.imageMovie}}" alt="movie image">
            <br />
            <div class="name">{{movie.nameMovie}}</div>
              {{rating.average_rating}} / 100
          </a>
        </li>
    </span>
    </div>
  </ul>
</div>
<ng-template #movieListEmpty>
  <p>movie list is empty.</p>
  <p>You need to create some movie!</p>
</ng-template>
