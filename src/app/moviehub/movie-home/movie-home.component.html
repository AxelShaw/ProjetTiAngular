<h2>Home</h2>
<div *ngIf="movies.length; else movieListEmpty">
  <ul>
    <div *ngFor="let movie of movies">
      <li *ngIf="convert(movie.release_movie) > myDate">
        <a routerLink="../detail/{{movie.idMovie}}">
          <img src="{{movie.imageMovie}}" alt="movie image">
          <br />
          {{movie.nameMovie}}<br />
        </a>
      </li>
    </div>
  </ul>
</div>
<ng-template #movieListEmpty>
  <p>movie list is empty.</p>
  <p>You need to create some movie!</p>
</ng-template>
